# nginx — единственная точка входа (same-origin). Сети: edge (наружу) и data (internal, без выхода в интернет).
name: veildeck

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

  api:
    build: ../backend
    environment:
      ENV: ${ENV}
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@postgres:5432/veildeck
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      HMAC_KEY: ${HMAC_KEY}
      WM_KEY: ${WM_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veildeck
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d veildeck"]
      interval: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [data]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge, data]

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata: {}
