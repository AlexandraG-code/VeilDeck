# Продакшен-конфиг nginx: закрытый доступ (basic auth), редирект на 443, TLS. Монтируется поверх default.conf образа web.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Закрытый доступ к стенду (AGENTS.md §2): всё за basic auth, кроме проверки живости.
    auth_basic "VeilDeck";
    auth_basic_user_file /etc/nginx/htpasswd;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        auth_basic off;
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
